# Hassouna Green - own server, own domain.
#
#   app  : the application container (built from this repository)
#   caddy: the reverse proxy that terminates HTTPS with a free certificate
#
# Only ports 80 and 443 are opened on the server; the app itself stays
# private inside the compose network.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Optional: enables the generative design and the AI review.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Written outside the image so the files survive a rebuild.
      - HASSOUNA_FEEDBACK_FILE=/data/hassouna_feedback.json
      - LLM_CACHE_FILE=/data/llm_cache.json
    volumes:
      - app-data:/data
    expose:
      - "8501"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
